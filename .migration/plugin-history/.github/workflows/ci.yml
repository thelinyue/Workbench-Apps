name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: log-analyzer-plugin
            path: plugins/log-analyzer-plugin
            binary: log_analyzer.exe
          - name: log-analyzer-rule-builder
            path: plugins/log-analyzer-rule-builder
            binary: rule_editor.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Check formatting
        shell: pwsh
        working-directory: ${{ matrix.path }}
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "以下 Go 文件尚未格式化：$($unformatted -join ', ')"
          }
      - name: Test
        working-directory: ${{ matrix.path }}
        run: go test ./...
      - name: Vet
        working-directory: ${{ matrix.path }}
        run: go vet ./...
      - name: Build Windows EXE
        working-directory: ${{ matrix.path }}
        run: go build -trimpath -o ${{ matrix.binary }} .
