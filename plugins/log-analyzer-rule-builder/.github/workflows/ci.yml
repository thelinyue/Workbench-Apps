name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "以下 Go 文件尚未格式化：$($unformatted -join ', ')"
          }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate Web plugin payload
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($manifest.type -ne 'Web' -or $manifest.entry -ne 'editor.html') { throw 'manifest.json 必须声明 Web/editor.html。' }
          if (-not (Test-Path -LiteralPath $manifest.entry)) { throw 'editor.html 不存在。' }
